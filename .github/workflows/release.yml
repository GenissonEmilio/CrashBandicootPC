# One button for a whole release: Actions > Release > Run workflow, type the
# version (for example 2.3), Run.
#
#   1. Writes the version into the sources (publish_release.py --set-version)
#      and pushes it to main as a commit named after the version, like the old
#      manual "2.2" commit. Nothing is committed if the sources already say it.
#   2. Builds the linux-arm64 native libraries (libcimgui.so, libnfd.so).
#   3. Builds the four release files with publish_release.py, in parallel:
#        CrashBandicoot.exe, CrashBandicoot-Linux, CrashBandicoot-Linux-arm64,
#        CrashBandicoot-<version>.apk
#   4. Puts them in a DRAFT release, tag <version> (no "v", the official-build
#      check looks the tag up by version). Write the notes, then press Publish.
#
# Running it again for a version that is still a draft rebuilds the files and
# replaces them. A version that is already published is refused.
#
# One-time setup: the APK must be signed with signing/android-release.keystore
# (the official-build check knows its certificate). Store it as two repository
# secrets, from the repo root in Git Bash:
#   base64 -w0 signing/android-release.keystore | gh secret set ANDROID_KEYSTORE_BASE64
#   gh secret set ANDROID_KEYSTORE_PROPERTIES < signing/keystore.properties
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (for example 2.3)'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Set version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      V: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$V" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Version '$V' must look like 2.3 or 2.3.1"
            exit 1
          fi
          if draft=$(gh release view "$V" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $V is already published. Pick a new version."
              exit 1
            fi
            echo "Draft release $V exists: its files will be replaced."
          fi

      - uses: actions/checkout@v7

      - name: Write the version into the sources
        run: python3 publish_release.py --set-version "$V"

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet; then
            echo "The sources already say $V: nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "$V"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  natives:
    # ImGui.NET 1.90.8.1 and NativeFileDialogSharp 0.5.0 ship no linux-arm64
    # libraries (issue #165), so we build them from the upstream sources, at the
    # exact commits those packages were built from. Every other native
    # dependency (GLFW, SDL, OpenAL, Skia, HarfBuzz, rabbitizer) already ships
    # linux-arm64 in its package.
    name: Build linux-arm64 natives
    # Ubuntu 22.04 = glibc 2.35. GLFW and OpenAL already need glibc 2.34, so
    # this adds no stricter requirement in practice (checked below).
    runs-on: ubuntu-22.04-arm
    env:
      # cimgui tag 1.90.8dock (Dear ImGui docking 1.90.8): the commit that
      # ImGui.NET-nativebuild v1.90.8 builds the ImGui.NET 1.90.8.1 natives from.
      CIMGUI_REF: 7c16d31cdb9d2db3038b324fe967ffa76b02c8c4
      # milleniumbug/nativefiledialog: the submodule commit of NativeFileDialogSharp 0.5.0.
      NFD_REF: 258a8850230f74ffdcf1c78d9bb012ea540e1bc5
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libgtk-3-dev file unzip curl

      - name: Check out cimgui
        uses: actions/checkout@v7
        with:
          repository: cimgui/cimgui
          ref: ${{ env.CIMGUI_REF }}
          submodules: recursive
          path: cimgui
          persist-credentials: false

      - name: Check out nativefiledialog
        uses: actions/checkout@v7
        with:
          repository: milleniumbug/nativefiledialog
          ref: ${{ env.NFD_REF }}
          path: nfd
          persist-credentials: false

      - name: Build libcimgui.so
        # Same as ImGui.NET-nativebuild's build-native.sh: cimgui's own
        # CMakeLists, Release. It names the file cimgui.so (PREFIX ""); the
        # NuGet package ships it as libcimgui.so.
        run: |
          cmake -S cimgui -B cimgui/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cimgui/build -j"$(nproc)"
          mkdir -p out
          cp cimgui/build/cimgui.so out/libcimgui.so
          strip --strip-unneeded out/libcimgui.so

      - name: Build libnfd.so
        # Same flags as build/gmake_linux/nfd.make (config release_x64), minus
        # -m64, which aarch64 gcc rejects.
        run: |
          gcc -O2 -fPIC -Wall -Wextra -fno-exceptions -DNDEBUG \
            -Infd/src/include $(pkg-config --cflags gtk+-3.0) \
            -shared -Wl,-soname=libnfd.so -s \
            -o out/libnfd.so nfd/src/nfd_common.c nfd/src/nfd_gtk.c \
            $(pkg-config --libs gtk+-3.0)

      - name: Check architecture and glibc
        run: |
          for f in libcimgui.so libnfd.so; do
            file "out/$f"
            if ! file "out/$f" | grep -q 'ARM aarch64'; then
              echo "::error::$f is not an aarch64 library"
              exit 1
            fi
            echo "$f needs: $(readelf -d "out/$f" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' | tr '\n' ' ')"
            echo "$f newest glibc symbol: $(objdump -T "out/$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          done

      - name: Compare exports with the x64 libraries in the NuGet packages
        # Same sources must give the same C exports. C++ (mangled) names are
        # skipped: their va_list types differ between x64 and arm64.
        run: |
          mkdir -p ref
          curl -sSfL -o ref/imgui.nupkg https://api.nuget.org/v3-flatcontainer/imgui.net/1.90.8.1/imgui.net.1.90.8.1.nupkg
          curl -sSfL -o ref/nfd.nupkg https://api.nuget.org/v3-flatcontainer/nativefiledialogsharp/0.5.0/nativefiledialogsharp.0.5.0.nupkg
          unzip -p ref/imgui.nupkg runtimes/linux-x64/native/libcimgui.so > ref/libcimgui.so
          unzip -p ref/nfd.nupkg runtimes/linux-x64/native/libnfd.so > ref/libnfd.so
          exports() { nm -D --defined-only "$1" | awk '$2 == "T" && $3 !~ /^_/ { print $3 }' | sort; }
          for f in libcimgui.so libnfd.so; do
            if ! diff <(exports "ref/$f") <(exports "out/$f"); then
              echo "::error::$f exports differ from the linux-x64 build in the NuGet package"
              exit 1
            fi
            echo "$f: $(exports "out/$f" | wc -l) C exports, same as linux-x64"
          done

      - name: Write SOURCES.txt
        run: |
          {
            echo "Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Runner: ubuntu-22.04-arm, $(gcc --version | head -1)"
            echo "libcimgui.so: https://github.com/cimgui/cimgui/tree/$CIMGUI_REF (tag 1.90.8dock)"
            echo "libnfd.so:    https://github.com/milleniumbug/nativefiledialog/tree/$NFD_REF"
            echo
            (cd out && sha256sum libcimgui.so libnfd.so)
          } > out/SOURCES.txt
          cat out/SOURCES.txt

      - name: Upload
        # Also handy for a local "publish_release.py --platform linux-arm64":
        # copy the two .so files into native/linux-arm64/.
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-natives
          path: out/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ${{ matrix.platform }}
    needs: [version, natives]
    # Windows for all four, like a local publish_release.py run.
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux, linux-arm64, android]
    env:
      PYTHONUNBUFFERED: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        env:
          # Own folder, so only this SDK's reference packs exist: the Android
          # project packs Microsoft.NETCore.App.Ref\10.0.*, and a second 10.0
          # pack from the runner image would add every file twice.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          dotnet-version: '10.0.3xx'

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android workload and SDK parts
        if: matrix.platform == 'android'
        shell: bash
        run: |
          dotnet workload install android
          dotnet build AndroidRuntimeHost/AndroidRuntimeHost.csproj -t:InstallAndroidDependencies -f net10.0-android \
            "-p:AndroidSdkDirectory=$ANDROID_HOME" "-p:JavaSdkDirectory=$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True
          # The APK packs RecompOne.Runtime\bin\Release\net10.0\RecompOne.Runtime.dll
          # (CompilerRefs). On a clean checkout build it first so that file exists.
          dotnet build RecompOne.Runtime/RecompOne.Runtime.csproj -c Release

      - name: Restore the Android signing key
        if: matrix.platform == 'android'
        shell: python
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          import base64, os, pathlib, sys

          data = os.environ.get("KEYSTORE_BASE64", "").strip()
          props = os.environ.get("KEYSTORE_PROPERTIES", "")
          if not data or not props.strip():
              print("::error::Secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PROPERTIES "
                    "are missing. See the one-time setup at the top of release.yml.")
              sys.exit(1)

          signing = pathlib.Path("signing").resolve()
          signing.mkdir(exist_ok=True)
          store = signing / "android-release.keystore"
          store.write_bytes(base64.b64decode(data))

          # Same file as the local signing/keystore.properties; only storeFile
          # (a path on Matteo's PC) is pointed at the restored keystore.
          lines = []
          for line in props.splitlines():
              key, _, value = line.partition("=")
              if key.strip() in ("storePassword", "keyPassword") and value.strip():
                  print(f"::add-mask::{value.strip()}")
              if key.strip() == "storeFile":
                  line = f"storeFile={store}"
              lines.append(line)
          (signing / "keystore.properties").write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Get the linux-arm64 natives
        if: matrix.platform == 'linux-arm64'
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-natives
          path: native/linux-arm64

      - name: Build
        run: python publish_release.py --platform ${{ matrix.platform }}

      - name: Pick the release file
        shell: bash
        run: |
          mkdir dist
          case "${{ matrix.platform }}" in
            windows)     cp publish-single/CrashBandicoot.exe dist/CrashBandicoot.exe ;;
            linux)       cp publish-linux/CrashBandicoot dist/CrashBandicoot-Linux ;;
            linux-arm64) cp publish-linux-arm64/CrashBandicoot dist/CrashBandicoot-Linux-arm64 ;;
            android)     cp publish-android/CrashBandicoot-*.apk dist/ ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        env:
          V: ${{ inputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if [ "$(ls dist | wc -l)" -ne 4 ]; then
            echo "::error::Expected 4 release files"
            exit 1
          fi
          if gh release view "$V" >/dev/null 2>&1; then
            gh release edit "$V" --target "$SHA"
            gh release upload "$V" dist/* --clobber
          else
            gh release create "$V" dist/* --draft --title "$V" --target "$SHA" --generate-notes
          fi
          echo "Draft release: $(gh release view "$V" --json url --jq .url)"
